<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex,follow">
    <meta name="theme-color" content="#0ba376">
    <meta name="color-scheme" content="dark">
    <title>404 — Page not found · Philippe Fontaine</title>
    <link rel="icon" href="favicon.ico" sizes="any">
    <link rel="icon" type="image/png" href="img/favicon.png">
    <style>
      :root { --primary: #0ba376; --primary-light: #0be29a; }
      * { box-sizing: border-box; margin: 0; padding: 0; }
      html, body { height: 100%; }
      body {
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        padding: 24px;
        font-family: "Poppins", "Segoe UI", Helvetica, Arial, sans-serif;
        color: #f5f5f5;
        text-align: center;
        background: linear-gradient(135deg, #0b7080, #0ba376, #0b5e6e);
        background-size: 300% 300%;
        animation: gradientShift 25s ease infinite;
      }
      @keyframes gradientShift {
        0% { background-position: 0% 50%; }
        50% { background-position: 100% 50%; }
        100% { background-position: 0% 50%; }
      }
      .card {
        max-width: 540px;
        width: 100%;
        padding: 48px 36px;
        background: rgba(34, 34, 34, 0.82);
        border: 1px solid rgba(255, 255, 255, 0.08);
        border-radius: 16px;
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
        box-shadow: 0 30px 80px -20px rgba(0, 0, 0, 0.55);
      }
      .code {
        font-size: 72px;
        font-weight: 700;
        line-height: 1;
        background: linear-gradient(90deg, var(--primary), var(--primary-light));
        -webkit-background-clip: text;
        background-clip: text;
        -webkit-text-fill-color: transparent;
      }
      h1 { font-size: 22px; margin: 18px 0 8px; font-weight: 600; }
      p { color: #bdbdbd; font-size: 15px; line-height: 1.6; }
      p .sep { opacity: 0.4; margin: 0 8px; }
      .actions { margin-top: 28px; display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; }
      a.btn {
        display: inline-block;
        padding: 12px 26px;
        border-radius: 30px;
        font-size: 14px;
        font-weight: 500;
        text-decoration: none;
        border: 2px solid var(--primary);
        color: #fff;
        transition: background-color 0.25s ease, color 0.25s ease;
      }
      a.btn:hover, a.btn:focus { background: var(--primary); }
      a.btn.secondary { border-color: rgba(255, 255, 255, 0.5); }
      a.btn.secondary:hover, a.btn.secondary:focus { background: rgba(255, 255, 255, 0.9); color: #222; }
      @media (prefers-reduced-motion: reduce) { body { animation: none; } }
    </style>
  </head>
  <body>
    <main class="card">
      <div class="code" aria-hidden="true">404</div>
      <h1>Page not found <span lang="fr">· Page introuvable</span></h1>
      <p>
        The page you are looking for doesn’t exist or has moved.
        <span class="sep">·</span>
        <span lang="fr">La page recherchée n’existe pas ou a été déplacée.</span>
      </p>
      <div class="actions">
        <a class="btn" href="/">Back to home</a>
        <a class="btn secondary" href="/index-fr.html" lang="fr">Version française</a>
      </div>
    </main>
  </body>
</html>
